[alembic]
script_location = alembic
prepend_sys_path = .

# The database URL is never stored here; alembic/env.py reads it from the
# backend environment (DATABASE_URL) via app.config, the single source of
# truth. This placeholder only satisfies Alembic's config parser.
sqlalchemy.url = postgresql+psycopg://user:pass@localhost/dbname
