<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1220" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="description" content="Investigate bugs. Verify patches. Trust evidence." />
    <title>RepoRescue — Verified debugging</title>
    <script>
      try {
        var stored = localStorage.getItem("reporescue-theme") || "system";
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
